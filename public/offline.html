<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1A365D" />
    <title>Choosie is offline</title>
    <style>
      :root {
        color: #1a365d;
        background: #f8f9ff;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        max-width: 420px;
        text-align: center;
      }

      img {
        width: 92px;
        height: 92px;
        object-fit: contain;
        margin-bottom: 24px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #55657d;
        font-size: 17px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/choosie-icon-192.png" alt="Choosie" />
      <h1>You are offline.</h1>
      <p>Reconnect to keep choosing with your group.</p>
    </main>
  </body>
</html>
